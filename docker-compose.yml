version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecofone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecofone_user
      POSTGRES_PASSWORD: ecofone_local_password
      POSTGRES_DB: ecofone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecofone_user -d ecofone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: ecofone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
    container_name: ecofone-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecofone_user:ecofone_local_password@postgres:5432/ecofone?schema=public
      DIRECT_URL: postgresql://ecofone_user:ecofone_local_password@postgres:5432/ecofone?schema=public
      INITIAL_ADMIN_PASSWORD: ecofone_admin_2026
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: ecofone-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "4012:4012"
    environment:
      NODE_ENV: production
      PORT: 4012
      DATABASE_URL: postgresql://ecofone_user:ecofone_local_password@postgres:5432/ecofone?schema=public
      DIRECT_URL: postgresql://ecofone_user:ecofone_local_password@postgres:5432/ecofone?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_jwt_secret_minimum_32_characters_long_for_security
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=200m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4012/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: ecofone-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      INTERNAL_BACKEND_URL: http://backend:4012
      NEXT_PUBLIC_API_URL: http://localhost:4012
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=200m
      - /app/.next/cache:rw,size=500m
      - /app/public/uploads:rw,size=500m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
